name: Testes e executáveis

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package: |
              dist/MonitorNoticias-windows.zip
              dist/MonitorNoticias-instalador-windows.exe
          - os: ubuntu-22.04  # glibc mais antiga: o binário roda em mais distribuições
            label: Linux
            package: dist/MonitorNoticias-linux.tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes
        run: python -m pytest -q

      - name: Versão do programa igual à tag publicada
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          init = pathlib.Path("monitor/__init__.py")
          init.write_text(re.sub(r'__version__ = "[^"]*"', f'__version__ = "{tag}"', init.read_text()))
          print("versão", tag)

      - name: Inno Setup (instalador do Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Gerar executável
        run: python empacotar.py

      - name: Autoteste do executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MonitorNoticias\MonitorNoticias.exe -ArgumentList '--autoteste' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste falhou: código $($p.ExitCode)" }

      - name: Janela própria abre no executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Simula o .zip baixado do navegador: o Windows marca cada arquivo extraído.
          Get-ChildItem dist\MonitorNoticias\_internal -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $p = Start-Process -FilePath dist\MonitorNoticias\MonitorNoticias.exe -ArgumentList '--testar-janela' -Wait -PassThru
          Get-Content dist\MonitorNoticias\data\logs\monitor.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "a janela própria não abriu: código $($p.ExitCode)" }
          $dll = Get-ChildItem dist\MonitorNoticias\_internal -Recurse -Filter Python.Runtime.dll | Select-Object -First 1
          if (Get-Item -LiteralPath $dll.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "marca de download não removida" }

      - name: Instalador, atualização e desinstalação (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\MonitorNoticias-instalador-windows.exe"
          if (-not (Test-Path $setup)) { throw "instalador não foi gerado" }
          $opts = '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/SEMABRIR=1'
          $p = Start-Process $setup -ArgumentList ($opts + '/LOG=instalacao.log') -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalacao.log -Tail 40; throw "instalação falhou: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\MonitorNoticias"
          foreach ($f in "$app\MonitorNoticias.exe", "$app\instalacao.ini") { if (-not (Test-Path $f)) { throw "faltando: $f" } }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Monitor de notícias.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "atalho da área de trabalho não foi criado" }
          if (Test-Path "$app\data") { throw "a pasta data não deveria ir para a instalação" }

          # A versão .zip (passo da janela acima) anotou onde guarda os dados; a instalada copia na 1ª vez.
          $dados = "$env:LOCALAPPDATA\MonitorNoticias"
          $p = Start-Process "$app\MonitorNoticias.exe" -ArgumentList '--testar-janela' -Wait -PassThru
          Get-Content "$dados\logs\monitor.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "a janela do programa instalado não abriu: $($p.ExitCode)" }
          if (-not (Test-Path "$dados\monitor.db")) { throw "dados da versão .zip não foram migrados" }
          if (-not (Test-Path "dist\MonitorNoticias\data\DADOS-MOVIDOS.txt")) { throw "aviso na pasta antiga não foi criado" }
          $p = Start-Process "$app\MonitorNoticias.exe" -ArgumentList '--autoteste' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do programa instalado falhou: $($p.ExitCode)" }

          # Atualização silenciosa por cima (como o botão "Atualizar agora" faz).
          $p = Start-Process $setup -ArgumentList ($opts + '/SILENT','/CLOSEAPPLICATIONS') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "atualização por cima falhou: $($p.ExitCode)" }
          if (-not (Test-Path "$dados\monitor.db")) { throw "a atualização apagou os dados" }

          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\MonitorNoticias.exe") { throw "desinstalação deixou o programa" }
          if (Test-Path -LiteralPath $lnk) { throw "desinstalação deixou o atalho" }
          if (-not (Test-Path "$dados\monitor.db")) { throw "a desinstalação não deve apagar os dados" }

      - name: Autoteste do executável (Linux)
        if: runner.os == 'Linux'
        run: ./dist/MonitorNoticias --autoteste

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-${{ matrix.label }}
          path: ${{ matrix.package }}
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar o Briefcase
        run: python -m pip install --upgrade pip briefcase

      - name: Gerar o app Android
        run: |
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android -p debug-apk --no-input
          mkdir -p pacotes
          cp dist/*.apk pacotes/MonitorNoticias-android.apk
          ls -la pacotes

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-Android
          path: pacotes/MonitorNoticias-android.apk
          retention-days: 30

  release:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true
      - name: Gerar SHA256SUMS.txt
        run: |
          cd pacotes
          sha256sum MonitorNoticias-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: pacotes/*
          generate_release_notes: true
