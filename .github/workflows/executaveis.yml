name: Testes e executáveis

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package: |
              dist/MonitorNoticias-windows.zip
              dist/MonitorNoticias-instalador-windows.exe
          - os: ubuntu-22.04  # glibc mais antiga: o binário roda em mais distribuições
            label: Linux
            package: |
              dist/MonitorNoticias-linux.tar.gz
              dist/MonitorNoticias-linux-x86_64.AppImage
              dist/MonitorNoticias-linux-amd64.deb
              dist/PKGBUILD
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes
        run: python -m pytest -q

      - name: Versão do programa igual à tag publicada
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          init = pathlib.Path("monitor/__init__.py")
          init.write_text(re.sub(r'__version__ = "[^"]*"', f'__version__ = "{tag}"', init.read_text()))
          print("versão", tag)

      - name: Inno Setup (instalador do Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Bibliotecas do Qt para embutir no executável (Linux)
        if: runner.os == 'Linux'
        # O PyInstaller copia para dentro do executável as que estiverem instaladas aqui;
        # sem elas o Qt embutido não carrega em distribuições que não as trazem.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbfile1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-randr0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-shm0 libxkbcommon0 \
            libxkbcommon-x11-0 xvfb
          # Estas o PyInstaller deixa de fora (são do driver de vídeo); todo desktop tem.
          sudo apt-get install -y -q libegl1 libgl1

      - name: Gerar executável
        run: python empacotar.py

      - name: Autoteste do executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MonitorNoticias\MonitorNoticias.exe -ArgumentList '--autoteste' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste falhou: código $($p.ExitCode)" }

      - name: Janela própria abre no executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Simula o .zip baixado do navegador: o Windows marca cada arquivo extraído.
          Get-ChildItem dist\MonitorNoticias\_internal -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $p = Start-Process -FilePath dist\MonitorNoticias\MonitorNoticias.exe -ArgumentList '--testar-janela' -Wait -PassThru
          Get-Content dist\MonitorNoticias\data\logs\monitor.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "a janela própria não abriu: código $($p.ExitCode)" }
          $dll = Get-ChildItem dist\MonitorNoticias\_internal -Recurse -Filter Python.Runtime.dll | Select-Object -First 1
          if (Get-Item -LiteralPath $dll.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "marca de download não removida" }

      - name: Instalador, atualização e desinstalação (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\MonitorNoticias-instalador-windows.exe"
          if (-not (Test-Path $setup)) { throw "instalador não foi gerado" }
          $opts = '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/SEMABRIR=1'
          $p = Start-Process $setup -ArgumentList ($opts + '/LOG=instalacao.log') -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalacao.log -Tail 40; throw "instalação falhou: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\MonitorNoticias"
          foreach ($f in "$app\MonitorNoticias.exe", "$app\instalacao.ini") { if (-not (Test-Path $f)) { throw "faltando: $f" } }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Monitor de notícias.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "atalho da área de trabalho não foi criado" }
          if (Test-Path "$app\data") { throw "a pasta data não deveria ir para a instalação" }

          # A versão .zip (passo da janela acima) anotou onde guarda os dados; a instalada copia na 1ª vez.
          $dados = "$env:LOCALAPPDATA\MonitorNoticias"
          Set-Content dist\MonitorNoticias\data\marca-migracao.txt "zip"
          Write-Host "Antes de abrir a versão instalada:"; Get-ChildItem $dados, dist\MonitorNoticias\data -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          Get-Content "$dados\versao-portatil.txt" -ErrorAction SilentlyContinue
          $p = Start-Process "$app\MonitorNoticias.exe" -ArgumentList '--testar-janela' -Wait -PassThru
          Get-Content "$dados\logs\monitor.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          Get-ChildItem $dados -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          if ($p.ExitCode -ne 0) { throw "a janela do programa instalado não abriu: $($p.ExitCode)" }
          if (-not (Test-Path "$dados\marca-migracao.txt")) { throw "dados da versão .zip não foram migrados" }
          if (-not (Test-Path "dist\MonitorNoticias\data\DADOS-MOVIDOS.txt")) { throw "aviso na pasta antiga não foi criado" }
          $p = Start-Process "$app\MonitorNoticias.exe" -ArgumentList '--autoteste' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do programa instalado falhou: $($p.ExitCode)" }

          # Atualização silenciosa por cima (como o botão "Atualizar agora" faz).
          $p = Start-Process $setup -ArgumentList ($opts + '/SILENT','/CLOSEAPPLICATIONS') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "atualização por cima falhou: $($p.ExitCode)" }
          if (-not (Test-Path "$dados\marca-migracao.txt")) { throw "a atualização apagou os dados" }

          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\MonitorNoticias.exe") { throw "desinstalação deixou o programa" }
          if (Test-Path -LiteralPath $lnk) { throw "desinstalação deixou o atalho" }
          if (-not (Test-Path "$dados\marca-migracao.txt")) { throw "a desinstalação não deve apagar os dados" }

      - name: Autoteste do executável (Linux)
        if: runner.os == 'Linux'
        run: ./dist/MonitorNoticias --autoteste

      - name: Janela própria abre no executável (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=xcb xvfb-run -a ./dist/MonitorNoticias --testar-janela | tee janela.txt
          grep -q "motor=qtwebengine.*-> OK" janela.txt || {
            # Mostra qual biblioteca o Qt não achou.
            QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb xvfb-run -a ./dist/MonitorNoticias --testar-janela 2>&1 | grep -iE "cannot|not found|failed" | head -20
            exit 1; }

      - name: Pacotes Linux (AppImage, .deb, PKGBUILD e pasta do Flatpak)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" python linux/pacotes.py appimage deb pkgbuild flatpak
          desktop-file-validate dist/flatpak/*.desktop

      - name: Instalar e testar o .deb e o AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/MonitorNoticias-linux-amd64.deb
          test -f /usr/share/applications/io.github.nerqs.MonitorNoticias.desktop
          (cd /tmp && monitor-noticias --autoteste) | tee deb.txt
          grep -q "instalação deb -> OK" deb.txt
          sudo apt-get remove -y monitor-noticias
          test ! -e /usr/bin/monitor-noticias
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/MonitorNoticias-linux-x86_64.AppImage --autoteste | tee appimage.txt
          grep -q "instalação appimage -> OK" appimage.txt

      - name: Guardar a pasta do Flatpak para o próximo job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-fonte
          path: dist/flatpak
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-${{ matrix.label }}
          path: ${{ matrix.package }}
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar o Briefcase
        run: python -m pip install --upgrade pip briefcase

      - name: Gerar o app Android
        run: |
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android -p debug-apk --no-input
          mkdir -p pacotes
          cp dist/*.apk pacotes/MonitorNoticias-android.apk
          ls -la pacotes

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-Android
          path: pacotes/MonitorNoticias-android.apk
          retention-days: 30

  arch:
    name: Arch Linux
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MonitorNoticias-Linux
          path: pacotes

      - name: Gerar o pacote com o PKGBUILD publicado
        run: |
          pacman -Syu --noconfirm --needed base-devel libglvnd
          useradd -m construtor
          mkdir /home/construtor/pkg
          ver=$(sed -n 's/^pkgver=//p' pacotes/PKGBUILD)
          cp pacotes/PKGBUILD /home/construtor/pkg/
          # Mesmo nome que o makepkg daria ao baixar da página de versões (o SHA-256 é conferido igual).
          cp pacotes/MonitorNoticias-linux.tar.gz "/home/construtor/pkg/MonitorNoticias-linux-$ver.tar.gz"
          chown -R construtor /home/construtor/pkg
          su construtor -c "cd /home/construtor/pkg && makepkg --noconfirm"
          mkdir -p saida
          cp /home/construtor/pkg/monitor-noticias-bin-*.pkg.tar.zst saida/MonitorNoticias-linux-x86_64.pkg.tar.zst

      - name: Instalar e testar
        run: |
          pacman -U --noconfirm saida/MonitorNoticias-linux-x86_64.pkg.tar.zst
          test -f /usr/share/applications/io.github.nerqs.MonitorNoticias.desktop
          (cd /tmp && monitor-noticias --autoteste) | tee arch.txt
          grep -q "instalação arch -> OK" arch.txt
          pacman -R --noconfirm monitor-noticias-bin

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-Arch
          path: saida/MonitorNoticias-linux-x86_64.pkg.tar.zst
          retention-days: 30

  flatpak:
    name: Flatpak
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-fonte
          path: flatpak

      - name: Gerar o .flatpak
        run: |
          chmod +x flatpak/MonitorNoticias
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo construcao flatpak/io.github.nerqs.MonitorNoticias.json
          mkdir -p saida
          # --runtime-repo: ao abrir o arquivo, o sistema baixa o runtime do Flathub sozinho.
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo saida/MonitorNoticias-linux.flatpak io.github.nerqs.MonitorNoticias

      - name: Instalar e testar
        run: |
          flatpak install --user -y --noninteractive --bundle saida/MonitorNoticias-linux.flatpak
          dbus-run-session -- flatpak run io.github.nerqs.MonitorNoticias --autoteste | tee flatpak.txt
          grep -q "instalação flatpak -> OK" flatpak.txt

      - name: Janela própria abre no Flatpak
        run: |
          # Sem servidor gráfico no contêiner: o Qt desenha fora da tela, mas carrega tudo igual.
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.nerqs.MonitorNoticias --testar-janela | tee janela.txt
          grep -q "motor=qtwebengine.*-> OK" janela.txt

      - uses: actions/upload-artifact@v7
        with:
          name: MonitorNoticias-Flatpak
          path: saida/MonitorNoticias-linux.flatpak
          retention-days: 30

  release:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, arch, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          pattern: MonitorNoticias-*
          merge-multiple: true
      - name: Gerar SHA256SUMS.txt
        run: |
          cd pacotes
          sha256sum MonitorNoticias-* PKGBUILD > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: pacotes/*
          generate_release_notes: true
