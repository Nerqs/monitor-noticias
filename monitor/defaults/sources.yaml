# Fontes de notícias. Edite pelo programa (página "Fontes") ou direto aqui.
#
# Campos:
#   id        identificador único (letras, números, hífen)
#   name      nome exibido
#   type      rss | cisa_kev | nvd | github_advisories | scrape
#   url       endereço do feed, da API ou da página
#   category  seguranca | tecnologia | games (games ficam numa área separada do leitor)
#   language  pt | en
#   enabled   true | false
# Para type: scrape, informe também:
#   item_selector, title_selector, link_selector e (opcional) summary_selector

# Pacotes de fontes que já foram acrescentados a esta lista (não mexa).
seeded: [games]

sources:
  # --- Segurança: fontes oficiais ---
  - id: cisa-kev
    name: CISA KEV (falhas exploradas)
    type: cisa_kev
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    category: seguranca
    language: en
    enabled: true
  - id: cisa-advisories
    name: CISA Advisories
    type: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    category: seguranca
    language: en
    enabled: true
  - id: nvd-critical
    name: NVD (CVEs críticos)
    type: nvd
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    category: seguranca
    language: en
    enabled: true
  - id: github-advisories
