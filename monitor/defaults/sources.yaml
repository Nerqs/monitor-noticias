# Fontes de notícias. Edite pelo programa (página "Fontes") ou direto aqui.
#
# Campos:
#   id        identificador único (letras, números, hífen)
#   name      nome exibido
#   type      rss | cisa_kev | nvd | github_advisories | scrape
#   url       endereço do feed, da API ou da página
#   category  seguranca | tecnologia
#   language  pt | en
#   enabled   true | false
# Para type: scrape, informe também:
#   item_selector, title_selector, link_selector e (opcional) summary_selector

sources:
  # --- Segurança: fontes oficiais ---
  - id: cisa-kev
    name: CISA KEV (falhas exploradas)
    type: cisa_kev
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    category: seguranca
    language: en
    enabled: true
  - id: cisa-advisories
    name: CISA Advisories
    type: rss
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    category: seguranca
    language: en
    enabled: true
  - id: nvd-critical
    name: NVD (CVEs críticos)
    type: nvd
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    category: seguranca
    language: en
    enabled: true
  - id: github-advisories
    name: GitHub Security Advisories
    type: github_advisories
    url: https://api.github.com/advisories
    category: seguranca
    language: en
    enabled: true
  - id: msrc
    name: Microsoft MSRC
    type: rss
    url: https://api.msrc.microsoft.com/update-guide/rss
    category: seguranca
    language: en
    enabled: true
  - id: sans-isc
    name: SANS ISC
    type: rss
    url: https://isc.sans.edu/rssfeed_full.xml
    category: seguranca
    language: en
    enabled: true
  - id: certbr
    name: CERT.br
    type: rss
    url: https://www.cert.br/rss/certbr-rss.xml
    category: seguranca
    language: pt
    enabled: true

